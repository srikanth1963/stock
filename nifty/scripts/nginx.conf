server {
    listen 80;
    server_name trading.smbenablers.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name trading.smbenablers.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/trading.smbenablers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading.smbenablers.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # Proxy to FastAPI app
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }

    # Larger body for webhook payloads
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/smb-algo-access.log;
    error_log  /var/log/nginx/smb-algo-error.log;
}
